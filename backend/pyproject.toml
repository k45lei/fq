[project]
name = "futurequest-backend"
version = "0.1.0"
description = "FutureQuest API and report worker"
requires-python = ">=3.12"

dependencies = [
    # Web
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "email-validator",

    # Database
    "sqlalchemy>=2.0",
    "asyncpg",
    "alembic",
    # Sync driver, used only by Alembic — see the note in alembic/env.py.
    "psycopg[binary]",

    # Auth — Google OAuth flow and signed session cookies.
    # httpx2, not httpx: Authlib's client prefers it and falls back to httpx with a
    # deprecation warning. Nothing in app/ imports either directly.
    "authlib",
    "httpx2",
    "itsdangerous",

    # Background jobs (report generation)
    "procrastinate",

    # Questionnaire content files (see app/seed.py)
    "pyyaml",

    # Reports and email
    "jinja2",
    "weasyprint",
    "resend",

    # Payments
    "stripe",
]

[dependency-groups]
dev = [
    # The ASGI test client. Only the suite uses httpx directly — the application's own HTTP
    # calls go through Authlib, which uses httpx2.
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

# This is an application, not a library — uv shouldn't try to build/install it.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The `backend/alembic/` directory shadows the installed `alembic` package as far as Ruff's
# import resolver is concerned, so without this it sorts `from alembic import context` into
# the first-party group — after `app.config`, which is not where it belongs.
known-third-party = ["alembic", "authlib", "fastapi", "httpx", "itsdangerous", "jinja2", "procrastinate", "pydantic", "pydantic_settings", "resend", "sqlalchemy", "stripe", "weasyprint", "yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# PLACEHOLDER PAY FIGURES — NOT SOURCED DATA.
#
#   uv run python -m app.seed_pay seeds/career-pay-mock.yaml
#
# These are rough, plausible US annual figures written to make the demo look complete. They are
# NOT from BLS or any other source, which is why `source: mock` — a value that exists so these
# can never be mistaken for real data, and so a real lookup outranks them once one exists.
#
# Replace with BLS/OEWS figures before this is shown to anyone making a decision on it. The
# real file would set `source: bls_oews`, a `source_url`, and the release's `as_of` date.
#
# Covers the 32 careers that can appear in a report: the first two `example_careers` of each
# family, since CAREERS_PER_FAMILY is 2.


# Development questionnaire. Placeholder content — not a validated instrument.
#
#   uv run python -m app.seed seeds/core-instrument-v1.yaml --publish
#
# Question order in this file is the order users see. Publishing freezes everything below;
# changes mean a new version (bump `version`, or fork the published one).

nickname: core-instrument
version: v1

questions:
  # ----------------------------------------------------------------- interests (free tier)
  - category: interests
    type: multi_choice
    prompt: Which of these activities sound appealing to you?
    help_text: Pick up to three.
    max_selections: 3
    options:
      - label: Taking apart a machine to see how it works
        trait: realistic
      - label: Running an experiment to test an idea
        trait: investigative
      - label: Designing something people will look at
        trait: artistic
      - label: Teaching someone a skill you have
        trait: social
      - label: Convincing a group to back your plan
        trait: enterprising
      - label: Getting a messy set of records in order
        trait: conventional

  - category: interests
    type: single_choice
    prompt: Which sounds more like a good day at work?
    options:
      - label: Solving a hard problem on your own
        trait: investigative
      - label: Leading a team through a hard problem
        trait: enterprising

  - category: interests
    type: scale
    prompt: I enjoy working with my hands.
    trait: realistic
    scale_min: 1
    scale_max: 5

  - category: interests
    type: scale
    prompt: I would rather follow a clear procedure than invent my own.
    trait: conventional
    scale_min: 1
    scale_max: 5

  # ----------------------------------------------------------------- strengths (paid tier)
  - category: strengths
    type: free_text
    prompt: Describe something you made or organised that you were proud of.
    help_text: A few sentences is plenty. What was hard about it?

  - category: strengths
    type: multi_choice
    prompt: Which of these do people come to you for?
    help_text: Pick up to three.
    max_selections: 3
    options:
      - label: Explaining something complicated
      - label: Keeping calm when plans fall apart
      - label: Noticing details everyone else missed
      - label: Getting a group to agree on something
      - label: Fixing or building things
      - label: Coming up with unexpected ideas

  - category: strengths
    type: free_text
    prompt: What kind of task makes you lose track of time?

  # ----------------------------------------------------------------- EQ (paid tier)
  - category: eq
    type: scale
    prompt: I stay calm when something goes wrong unexpectedly.
    scale_min: 1
    scale_max: 5

  - category: eq
    type: scale
    prompt: I find it hard to tell how someone else is feeling.
    help_text: Answer honestly — there is no better or worse score here.
    reverse_scored: true
    scale_min: 1
    scale_max: 5

  - category: eq
    type: scale
    prompt: I can usually name what I am feeling and why.
    scale_min: 1
    scale_max: 5

  - category: eq
    type: free_text
    prompt: Describe a time you disagreed with someone and it went well.

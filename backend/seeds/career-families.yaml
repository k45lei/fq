# The career family vocabulary — a closed, curated set.
#
#   uv run python -m app.seed_careers seeds/career-families.yaml
#
# Safe to re-run: families upsert on `slug`. Never delete one that reports may reference;
# set `is_active: false` instead.
#
# `holland_code` is ordered, most characteristic trait first, and drives family ranking.
# `example_careers` anchor what a family means. They are illustrative, not exhaustive — that
# is the whole reason there is no `careers` table.

families:
  - slug: health-and-medicine
    name: Health & Medicine
    description: >-
      Caring for people's physical and mental health, from direct patient care to diagnostics
      and research. Combines scientific knowledge with sustained human contact.
    holland_code: [social, investigative, realistic]
    example_careers:
      - Registered Nurse
      - Physiotherapist
      - Paramedic
      - Radiographer
      - Pharmacist
      - Speech and Language Therapist

  - slug: engineering
    name: Engineering
    description: >-
      Designing, building and testing physical systems — structures, machines, vehicles,
      energy. Applied problem-solving where the result has to work in the real world.
    holland_code: [realistic, investigative, conventional]
    example_careers:
      - Mechanical Engineer
      - Civil Engineer
      - Electrical Engineer
      - Aerospace Engineer
      - Manufacturing Engineer

  - slug: software-and-data
    name: Software & Data
    description: >-
      Building software and making sense of data. Abstract, fast-moving, and unusually open
      to people who learn by doing.
    holland_code: [investigative, conventional, realistic]
    example_careers:
      - Software Engineer
      - Data Analyst
      - Cybersecurity Analyst
      - Machine Learning Engineer
      - Site Reliability Engineer

  - slug: science-and-research
    name: Science & Research
    description: >-
      Investigating how things work and generating new knowledge, in laboratories, the field,
      or on paper. Rewards patience and comfort with uncertainty.
    holland_code: [investigative, realistic, artistic]
    example_careers:
      - Research Scientist
      - Laboratory Technician
      - Environmental Scientist
      - Biotechnologist
      - Statistician

  - slug: education-and-training
    name: Education & Training
    description: >-
      Helping people learn, from classrooms to workplace training and educational design.
      Built on explaining things clearly and reading a room.
    holland_code: [social, artistic, enterprising]
    example_careers:
      - Teacher
      - Learning Designer
      - Educational Psychologist
      - Corporate Trainer
      - Teaching Assistant

  - slug: business-and-management
    name: Business & Management
    description: >-
      Running organisations and the teams inside them — planning, coordinating, deciding.
      Generalist work where judgement matters more than any single technical skill.
    holland_code: [enterprising, conventional, social]
    example_careers:
      - Operations Manager
      - Project Manager
      - Management Consultant
      - Human Resources Manager
      - Business Analyst

  - slug: finance-and-accounting
    name: Finance & Accounting
    description: >-
      Managing money, risk and financial records. Precise, rules-heavy work with clear right
      answers and real consequences for getting them wrong.
    holland_code: [conventional, enterprising, investigative]
    example_careers:
      - Accountant
      - Financial Analyst
      - Actuary
      - Auditor
      - Investment Analyst

  - slug: law-and-public-policy
    name: Law & Public Policy
    description: >-
      Working with rules and how they shape society — advising, advocating, drafting,
      governing. Argument-heavy and detail-heavy in equal measure.
    holland_code: [enterprising, investigative, social]
    example_careers:
      - Solicitor
      - Policy Adviser
      - Paralegal
      - Compliance Officer
      - Diplomat

  - slug: arts-design-and-media
    name: Arts, Design & Media
    description: >-
      Making things people see, hear and use — visual design, film, games, performance.
      Craft-led, portfolio-driven, and rarely a straight career path.
    holland_code: [artistic, enterprising, social]
    example_careers:
      - Graphic Designer
      - UX Designer
      - Animator
      - Film Editor
      - Game Designer
      - Photographer

  - slug: writing-and-communication
    name: Writing & Communication
    description: >-
      Shaping what an organisation or audience understands — journalism, copywriting,
      technical writing, public relations.
    holland_code: [artistic, social, enterprising]
    example_careers:
      - Journalist
      - Copywriter
      - Technical Writer
      - Public Relations Officer
      - Content Strategist

  - slug: skilled-trades
    name: Skilled Trades & Construction
    description: >-
      Hands-on work with tools, materials and systems, usually learned through
      apprenticeship. Visible results and consistently strong demand.
    holland_code: [realistic, conventional, investigative]
    example_careers:
      - Electrician
      - Plumber
      - Carpenter
      - HVAC Technician
      - Welder
      - Site Supervisor

  - slug: agriculture-and-environment
    name: Agriculture & Environment
    description: >-
      Working with land, animals and natural systems — food production, conservation,
      sustainability. Often outdoors and seasonal.
    holland_code: [realistic, investigative, social]
    example_careers:
      - Agronomist
      - Conservation Officer
      - Veterinary Nurse
      - Forestry Technician
      - Sustainability Consultant

  - slug: hospitality-and-tourism
    name: Hospitality & Tourism
    description: >-
      Looking after people away from home — food, travel, events, accommodation. Fast-paced,
      people-facing, and unusually easy to enter and progress in.
    holland_code: [enterprising, social, conventional]
    example_careers:
      - Chef
      - Event Manager
      - Hotel Manager
      - Travel Consultant
      - Restaurant Manager

  - slug: social-and-community
    name: Social & Community Services
    description: >-
      Supporting people through difficulty — social work, counselling, youth and community
      work. Emotionally demanding and directly meaningful.
    holland_code: [social, enterprising, artistic]
    example_careers:
      - Social Worker
      - Counsellor
      - Youth Worker
      - Careers Adviser
      - Charity Programme Manager

  - slug: sales-and-marketing
    name: Sales & Marketing
    description: >-
      Understanding what people want and persuading them — selling, brand building, market
      research. Outcomes are measured quickly and publicly.
    holland_code: [enterprising, social, artistic]
    example_careers:
      - Account Manager
      - Marketing Executive
      - Brand Manager
      - Market Researcher
      - Digital Marketing Specialist

  - slug: logistics-and-operations
    name: Logistics & Operations
    description: >-
      Moving goods and keeping complex systems running on time — supply chain, transport,
      warehousing, planning.
    holland_code: [conventional, realistic, enterprising]
    example_careers:
      - Supply Chain Analyst
      - Logistics Coordinator
      - Procurement Officer
      - Warehouse Operations Manager
      - Transport Planner

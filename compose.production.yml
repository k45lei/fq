name: futurequest
services:
  api:
    build: backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?Provide a dedicated production PostgreSQL URL}
      SESSION_KEY: ${SESSION_KEY:?Generate a production session key}
      APP_ORIGIN: https://${PUBLIC_HOST:?Set the public hostname}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Configure Google OAuth}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Configure Google OAuth}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Configure Stripe}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:?Configure a one-time Stripe price}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Configure the Stripe webhook}
      RESULT_API_SECRET: ${RESULT_API_SECRET:-}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the public hostname}
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
